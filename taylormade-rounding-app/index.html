<style>
/* Layout: one phone-width column, sticky header, fixed bottom tab bar; store and admin share the shell */
:root{
  --bg:#FFFFFF; --surface:#F4F5F7; --line:#E3E5E9; --ink:#14171C; --muted:#69707B;
  --accent:#1D3361; --accent-ink:#FFFFFF; --accent-soft:#E9EDF6;
  --red:#D2372D; --red-soft:#FCEBEA; --amber:#C77A0E; --amber-soft:#FCF1E1;
  --gray:#7F8692; --gray-soft:#EEF0F3; --green:#1E8049; --green-soft:#E5F4EB;
  --shadow:0 1px 2px rgba(20,23,28,.06),0 4px 16px rgba(20,23,28,.06);
  --font:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111317; --surface:#1A1D23; --line:#2B2F37; --ink:#ECEEF1; --muted:#9AA1AC;
  --accent:#8FA8E0; --accent-ink:#0E1424; --accent-soft:#1E2740;
  --red:#F0766D; --red-soft:#3A1E1C; --amber:#E9A94C; --amber-soft:#3A2C17;
  --gray:#9AA1AC; --gray-soft:#262A31; --green:#5CC48A; --green-soft:#183326;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#1A1D23; --line:#2B2F37; --ink:#ECEEF1; --muted:#9AA1AC;
  --accent:#8FA8E0; --accent-ink:#0E1424; --accent-soft:#1E2740;
  --red:#F0766D; --red-soft:#3A1E1C; --amber:#E9A94C; --amber-soft:#3A2C17;
  --gray:#9AA1AC; --gray-soft:#262A31; --green:#5CC48A; --green-soft:#183326;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.app.nologin{padding-bottom:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:12px}
.top h1{font-size:17px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface);color:var(--muted);white-space:nowrap}
.chip.admin{background:var(--accent);color:var(--accent-ink)}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13px;padding:6px 4px}
main{flex:1;display:flex;flex-direction:column;gap:16px;padding-block:16px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.soft{background:var(--surface);border-color:transparent}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
h2{font-size:20px;font-weight:700;margin:2px 0 0;text-wrap:balance}
h3{font-size:15px;font-weight:700;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.num{font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-none{color:var(--red);background:var(--red-soft)}
.s-wait{color:var(--gray);background:var(--gray-soft)}
.s-fix{color:var(--amber);background:var(--amber-soft)}
.s-ok{color:var(--green);background:var(--green-soft)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:52px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.sm{min-height:40px;font-size:14px;width:auto;padding:0 14px}
.btn.line{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.warn{background:var(--amber);color:#fff}
.dday{font-size:13px;font-weight:700;color:var(--red)}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;padding:8px 6px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:var(--shadow)}
/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.input,select.input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;font-size:15px;color:var(--ink)}
textarea.input{min-height:72px;padding:10px 12px}
/* upload items */
.item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.thumb{width:64px;height:64px;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}
.item .t{min-width:0}
.item .t b{display:block;font-size:15px}
.item .t span{display:block;font-size:13px;color:var(--muted)}
.req{font-size:11px;font-weight:700;color:var(--accent);margin-left:4px}
.item .t b .req{display:inline}
.camera{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;display:flex;gap:6px;align-items:center}
.camera.done{color:var(--green);border-color:var(--green-soft);background:var(--green-soft)}
.progress{height:6px;border-radius:99px;background:var(--surface);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
/* stamps */
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--muted);font-weight:600;max-width:100%}
.stamp.on{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.stamp.on svg{width:26px;height:26px}
.stamp.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
/* admin */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);background:var(--bg);width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0}
.li:first-child{border-top:0}
.li .nm{flex:1;min-width:0}
.li .nm b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .nm span{font-size:12px;color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted);font-size:14px}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto}
.ph{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.phc{border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.phc .img{aspect-ratio:4/3;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;padding:8px;max-width:100%}
.phc .img.sample{background:repeating-linear-gradient(135deg,var(--surface) 0 10px,var(--gray-soft) 10px 20px)}
.phc .img img{width:100%;height:100%;object-fit:cover}
.phc .cap{padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.phc .cap b{font-size:13px}
.vd{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.vd button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 0;font-size:12px;font-weight:600;color:var(--muted)}
.vd button.on-ok{background:var(--green-soft);color:var(--green);border-color:transparent}
.vd button.on-fix{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.banner{font-size:12px;color:var(--muted);text-align:center;padding:6px 0}
.check{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.notice-slide{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.notice-slide:first-child{border-top:0}
.notice-slide i{font-style:normal;font-size:12px;font-weight:700;color:var(--muted);padding-top:2px}
.brand{font-weight:700;letter-spacing:.08em;font-size:13px;color:var(--muted)}
.login{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:24px;padding-block:32px}
.login h2{font-size:26px}
.inline-confirm{background:var(--red-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.slides{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 16px;scroll-padding:0 16px;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slides button{flex:0 0 88%;scroll-snap-align:start;border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;background:#fff;aspect-ratio:16/9;max-width:100%}
.slides img{width:100%;height:100%;object-fit:contain;display:block}
.pin{padding:0 16px}
.dots{display:flex;gap:5px;justify-content:center;padding-top:2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
button.thumb{border:1px solid var(--line);padding:0;position:relative;background:#fff}
button.thumb img{object-fit:cover}
button.thumb em{position:absolute;left:3px;bottom:3px;font-style:normal;font-size:10px;font-weight:700;background:rgba(20,23,28,.75);color:#fff;border-radius:4px;padding:1px 4px}
.viewer{position:fixed;inset:0;z-index:50;background:#0B0C0F;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

.viewer .vimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 8px;overflow:auto}
.viewer .vimg img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:4px}
.viewer .vb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:12px 16px 16px}
.viewer button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;min-height:44px;padding:0 16px;font-weight:600}
.viewer button:disabled{opacity:.3}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

function seed(){
  for(const s of STORES){
    const r = rnd(hash(s.name));
    for(const w of [...OCT, ...NOV.slice(0,2)]){
      const ok = r() < 0.82;
      subs[w.key+'|'+s.name] = ok ? {status:'ok', time:'금 '+(14+Math.floor(r()*9))+':'+String(Math.floor(r()*60)).padStart(2,'0'), by:NAMES[Math.floor(r()*8)], photos:{}, verdict:{}, reason:'', best:r()<0.08, sample:true} : {status:'none', photos:{}, verdict:{}};
    }
    const x = r();
    const status = x < 0.22 ? 'none' : x < 0.58 ? 'wait' : x < 0.66 ? 'fix' : 'ok';
    const days = ['월','화','수'];
    subs[CUR+'|'+s.name] = status==='none' ? {status:'none', photos:{}, verdict:{}} :

}

function restoreSlides(){
  const el = document.getElementById('slides'); if(!el || !el.firstElementChild) return;
  const w = el.firstElementChild.getBoundingClientRect().width + 10;
  el.scrollLeft = S.slideIdx * w;
  el.addEventListener('scroll', ()=>{
    const k = Math.max(0, Math.min(9, Math.round(el.scrollLeft / w)));
    if(k===S.slideIdx) return; S.slideIdx = k;
    document.getElementById('slideNo').textContent = (k+1)+' / 10';
    document.getElementById('slideT').textContent = SLIDE_T[k];
    [...document.getElementById('dots').children].forEach((d,j)=>d.classList.toggle('on', j===k));

function countsFor(t){

  return c;
}

      ${deleted ? '<p class="small" style="margin:0">10월 사진을 삭제했습니다.</p>' : `
      ${dl ? `<button class="btn line" data-act="saveoct">10월 사진 전체 저장</button>` : ''}
      ${S.confirmDel ? `<div class="inline-confirm"><b class="small">10월 사진을 삭제할까요? 되돌릴 수 없어요.</b><div class="row"><button class="btn sm ghost" data-act="cancelDel" style="flex:1">취소</button><button class="btn sm" style="flex:1;background:var(--red);color:#fff" data-act="doDel">삭제</button></div></div>`
        : `<button class="btn ghost" data-act="askDel" ${S.saved.oct?'':'disabled'}>10월 사진 삭제</button>`}`}
    </section>`;
}

// ---- photo helpers ----
function compress(file){
  return new Promise((res,rej)=>{
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = ()=>{ const k = Math.min(1, 1600/Math.max(img.width,img.height)); const c = document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(b=>b?res({blob:b,url:URL.createObjectURL(b)}):rej(),'image/jpeg',0.82); };
    img.onerror = ()=>{ URL.revokeObjectURL(u); rej(); };
    img.src = u;
  });
}
const phCache = {};
function placeholder(item){
  if(phCache[item]) return phCache[item];
  const c = document.createElement('canvas'); c.width=480; c.height=360; const g=c.getContext('2d');
  g.fillStyle='#EEF0F3'; g.fillRect(0,0,480,360); g.fillStyle='#1D3361'; g.font='600 30px sans-serif'; g.textAlign='center';
  g.fillText(item,240,170); g.fillStyle='#69707B'; g.font='22px sans-serif'; g.fillText('예시 사진',240,212);
  return phCache[item] = new Promise(r=>c.toBlob(r,'image/jpeg',0.7));
}
const safe = s => s.replace(/[\\/:*?"<>|]/g,'_');
async function zipFor(weeks, types, onlyStore){
  if(!Array.isArray(types)) types=[types];
  const zip = new JSZip();
  for(const t of types){
  for(const w of weeks){
    const root = zip.folder(safe(w.label.replace(' ','')+'_'+TYPE[t].replace('용','')));
    for(const s of STORES.filter(x=>x.type===t && (!onlyStore || x.name===onlyStore))){
      const x = subs[w.key+'|'+s.name]; if(!x || x.status==='none') continue;
      const f = root.folder(safe(s.name));
      for(const [i,it] of ITEMS[t].entries()){
        let blob = null;
        if(x.photoBlobs && x.photoBlobs[i]) blob = x.photoBlobs[i];
        else if(x.sample) blob = await placeholder(it.n);
        if(blob) f.file(String(i+1).padStart(2,'0')+'_'+it.k+'.jpg', blob);
      }
    }
  }
  }
  return zip.generateAsync({type:'blob'});
}
async function save(filename, makeBlob){
  if(!dl){ toast('이 화면에서는 파일 저장을 쓸 수 없어요'); return false; }
  toast('ZIP 파일을 만드는 중…');
  try{ const data = await makeBlob(); await dl.save({filename, data}); toast('저장했습니다'); return true; }
  catch(e){ toast(e && e.code==='declined' ? '저장을 취소했습니다' : '저장하지 못했어요. 다시 시도해 주세요.'); return false; }
}

// ---- events ----
document.addEventListener('click', async e=>{
  const el = e.target.closest('[data-slide],[data-vnav],[data-act],[data-tab],[data-login],[data-acct],[data-shoot],[data-atype],[data-filter],[data-open],[data-vd],[data-ntype],[data-month],[data-zip]');
  if(!el) return;
  if(el.matches('.sheet-bg') && e.target.closest('[data-stop]')) return;
  const d = el.dataset;
  if(d.slide){ S.viewer = {t:typeOf(S.store), i:+d.slide}; return render(); }
  if(d.vnav){ S.viewer.i = Math.max(1, Math.min(10, S.viewer.i + +d.vnav)); return render(); }
  if(d.act==='vclose'){ S.viewer=null; return render(); }
  if(d.login){ S.loginMode = d.login; return render(); }
  if(d.acct){ S.loginStore = document.getElementById('loginStore')?.value || S.loginStore; S.account = d.acct; return render(); }
  if(d.tab){ if(S.role==='admin') S.atab=d.tab; else { S.tab=d.tab; if(d.tab!=='mine') S.popStamp=false; } window.scrollTo(0,0); return render(); }
  if(d.atype){ S.atype=d.atype; S.filter='all'; return render(); }
  if(d.filter){ S.filter=d.filter; return render(); }
  if(d.open){ S.detail=d.open; return render(); }
  if(d.month){ S.awardMonth=d.month; return render(); }
  if(d.ntype){ S.nform.type=d.ntype; S.nform.items=null; return render(); }
  if(d.shoot!==undefined){ S.camFor=+d.shoot; S.memo=document.getElementById('memo')?.value||''; document.getElementById('cam').click(); return; }
  if(d.vd){ const [i,v]=d.vd.split('|'); const s=sub(S.detail); s.reason=document.getElementById('reason')?.value||s.reason; s.verdict[i]=s.verdict[i]===v?undefined:v; return render(); }
  if(d.zip){ const w=NOV.find(x=>x.key===d.zip); return save(`${w.label.replace(' ','')}_${TYPE[S.atype].replace('용','')}.zip`, ()=>zipFor([w],S.atype)); }
  const a = d.act;
  if(a==='login'){
    if((S.loginMode||'store')==='store'){ S.role='store'; S.store=document.getElementById('loginStore').value; S.tab='home';
      const s=sub(S.store); if(s.sample && s.status!=='fix'){ subs[CUR+'|'+S.store]={status:'none',photos:{},verdict:{}}; } S.draft={}; }
    else { S.role='admin'; S.atab='status'; }
    window.scrollTo(0,0); return render();
  }
  if(a==='logout'){ S.slideIdx=0; S.viewer=null; S.role=null; S.detail=null; S.loginStore=S.store||S.loginStore; return render(); }
  if(a==='close'){ S.detail=null; return render(); }
  if(a==='submit'){
    const its=itemsFor(S.store); const now=new Date(); const dn=['일','월','화','수','목','금','토'][now.getDay()];
    subs[CUR+'|'+S.store]={status:'wait', time:`${dn} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`, by:S.account==='매니저'?'매니저':'직원', memo:document.getElementById('memo')?.value||'',
      photos:Object.fromEntries(Object.entries(S.draft).map(([i,v])=>[i,v.url])), photoBlobs:Object.fromEntries(Object.entries(S.draft).map(([i,v])=>[i,v.blob])), verdict:{}, reason:'', best:false};
    S.draft={}; toast('제출했습니다. 검수 후 스탬프가 지급됩니다'); return;
  }
  if(a==='remind'){ const c=countsFor(S.atype); toast(`미제출 ${c.none}곳(계정 ${c.none*2}개)에 보낼 알림을 준비했어요 · 시범 버전이라 실제 발송은 없어요`); return; }
  if(a==='remindone'){ toast('리마인드를 준비했어요 · 시범 버전이라 실제 발송은 없어요'); return; }
  if(a==='approve'||a==='fix'){
    const s=sub(S.detail); s.reason=document.getElementById('reason')?.value||''; s.best=document.getElementById('best')?.checked||false;
    if(a==='fix' && !s.reason.trim()){ toast('보완 사유를 한 줄 적어 주세요'); return; }
    s.status = a==='approve'?'ok':'fix'; const n=S.detail; S.detail=null;
    if(a==='approve' && n===S.store) S.popStamp=true;
    toast(a==='approve'?`${n} 승인 · 스탬프 지급`:`${n}에 보완 요청을 보냈어요`); return;
  }
  if(a==='saveone'){ const n=S.detail; return save(`11월3주차_${safe(n)}.zip`, ()=>zipFor([NOV[2]],typeOf(n),n)); }
  if(a==='pickfile'){ document.getElementById('noticeFile').click(); return; }
  if(a==='copyD'){ const f=S.nform; f.type='D'; f.items=ITEMS.D.map(x=>({...x})); toast('백화점용 초안을 만들었어요 · POP·행거 항목이 백화점 기준으로 바뀌었어요'); return; }
  if(a==='publish'){ const f=S.nform; f.week=document.getElementById('nWeek').value; f.due=document.getElementById('nDue').value;
    S.notices.push({id:'n'+Date.now(), week:f.week, type:f.type, posted:'방금', due:f.due, slides:f.files.length||10});
    toast(`${f.week} ${TYPE[f.type]} 공지를 발행했어요 (${STORES.filter(s=>s.type===f.type).length}곳)`); return; }
  if(a==='award'){ const m=S.awardMonth; S.gift=document.getElementById('gift').value; Object.entries(S.picks).filter(([,v])=>v).forEach(([store])=>S.awards.push({store,month:m,gift:S.gift})); const n=Object.values(S.picks).filter(Boolean).length; S.picks={}; toast(`${n}곳을 ${m}월 우수 매장으로 선정했어요`); return; }
  if(a==='saveoct'){ const ok = await save('10월_사진_전체.zip', ()=>zipFor(OCT,['A','D'])); if(ok){ S.saved.oct=true; render(); } return; }
  if(a==='askDel'){ S.confirmDel=true; return render(); }
  if(a==='cancelDel'){ S.confirmDel=false; return render(); }
  if(a==='doDel'){ S.confirmDel=false; S.deleted.oct=true; toast('10월 사진을 삭제했어요'); return; }
});
document.addEventListener('change', async e=>{
  const t = e.target;
  if(t.id==='cam' && t.files[0] && S.camFor!==null){
    try{ const r = await compress(t.files[0]); S.draft[S.camFor]=r; }catch(err){ toast('사진을 읽지 못했어요. 다시 찍어 주세요'); }
    t.value=''; S.camFor=null; render();
  }
  if(t.id==='noticeFile'){ S.nform.files=[...t.files].map(f=>f.name); t.value=''; render(); }
  if(t.dataset.pick){ S.picks[t.dataset.pick]=t.checked; render(); }
  if(t.dataset.nreq!==undefined){ S.nform.items[+t.dataset.nreq].req=t.checked; render(); }
  if(t.id==='loginStore'){ S.loginStore=t.value; }
  if(t.id==='gift'){ S.gift=t.value; }
});
document.addEventListener('keydown', e=>{
  if(!S.viewer) return;
  if(e.key==='Escape'){ S.viewer=null; render(); }
  if(e.key==='ArrowRight' && S.viewer.i<10){ S.viewer.i++; render(); }
  if(e.key==='ArrowLeft' && S.viewer.i>1){ S.viewer.i--; render(); }
});
document.addEventListener('input', e=>{
  if(e.target.id==='q'){ S.q=e.target.value.trim(); const pos=e.target.selectionStart; render(); const q=document.getElementById('q'); q.focus(); try{q.setSelectionRange(pos,pos)}catch(_){} }
});
render();
</script>
